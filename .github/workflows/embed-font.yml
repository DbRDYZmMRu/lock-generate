name: Embed Font in Document

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  embed-font:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install python-docx

      - name: Process Document
        run: |
          python -c "
          from docx import Document
          from docx.oxml.ns import qn
          from docx.oxml import OxmlElement

          def process():
              input_file = 'FrithHiltonVentures_Letterhead.docx'
              output_file = 'FrithHiltonVentures_Letterhead_Embedded.docx'
              font_name = 'Baron Neue'

              doc = Document(input_file)
              
              # Set font for all paragraphs and runs
              for para in doc.paragraphs:
                  for run in para.runs:
                      run.font.name = font_name
                      r = run._element
                      rPr = r.get_or_add_rPr()
                      rFonts = OxmlElement('w:rFonts')
                      rFonts.set(qn('w:ascii'), font_name)
                      rFonts.set(qn('w:hAnsi'), font_name)
                      rPr.append(rFonts)

              # Update Styles
              for style in doc.styles:
                  if hasattr(style, 'font'):
                      style.font.name = font_name

              # Enable Font Embedding Flags
              settings = doc.settings._element
              embed_fonts = OxmlElement('w:embedTrueTypeFonts')
              embed_fonts.set(qn('w:val'), 'true')
              settings.append(embed_fonts)

              doc.save(output_file)
          
          process()
          "

      - name: Commit and Push Updated Document
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f FrithHiltonVentures_Letterhead_Embedded.docx ]; then
            git add FrithHiltonVentures_Letterhead_Embedded.docx
            git commit -m "chore: embed Baron Neue font in letterhead"
            git push
          else
            echo "Output file not found."
            exit 1
          fi